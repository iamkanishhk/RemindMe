<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to the app</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'sans-serif'],
                    },
                    colors: {
                        ios: {
                            grayBg: '#e9ecef',
                            darkText: '#0d0d0d',
                            subtext: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #cbd5e1;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* iOS Liquid / Tactile Button Animations */
        .btn-google {
            background-color: #e9ecef;
            color: #2b303a;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-google:active {
            transform: scale(0.97);
            background-color: #dee2e6;
        }

        .btn-apple {
            background-color: #000000;
            color: #ffffff;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .btn-apple:active {
            transform: scale(0.97);
            background-color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Entrance Animation */
        @keyframes iosFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: iosFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-[390px] h-full max-h-[844px] bg-white rounded-[48px] shadow-2xl border-[8px] border-slate-900/10 flex flex-col justify-between overflow-hidden relative p-5 select-none">
        
        <!-- Top System Status Bar -->
        <div class="w-full flex items-center justify-between pt-1 pb-1 z-20 shrink-0 px-2">
            <span class="text-xs font-bold text-slate-900 tracking-tight">9:41</span>
            
            <!-- System Status Icons -->
            <div class="flex items-center gap-1.5 text-slate-900 text-xs">
                <i class="fa-solid fa-signal text-[11px]"></i>
                <i class="fa-solid fa-wifi text-[11px]"></i>
                <i class="fa-solid fa-battery-full text-[13px]"></i>
            </div>
        </div>

        <!-- Main Body Content Section -->
        <div class="flex-1 flex flex-col items-center justify-between my-auto py-4 z-10 overflow-hidden animate-fade-in">
            
            <!-- Illustration Container using assets/2.png -->
            <div class="relative w-full flex items-center justify-center my-auto min-h-[220px] px-2">
                <img src="../assets/2.png" 
                     alt="Welcome Illustration" 
                     class="max-w-[270px] max-h-[240px] w-auto h-auto object-contain transition-transform duration-300 hover:scale-[1.02]">
            </div>

            <div class="text-center px-4 space-y-3 my-auto">
                <h1 class="text-[26px] sm:text-[28px] font-bold text-slate-900 tracking-tight leading-tight">
                    Welcome to the app
                </h1>
                <p class="text-[13px] sm:text-[14px] text-slate-400 font-normal leading-relaxed px-2 max-w-[310px] mx-auto">
                    We're excited to help you book and manage your service appointments with ease.
                </p>
            </div>

            <div class="w-full space-y-3.5 px-2 mt-auto pt-4">
                <!-- Continue with Google Button -->
                <button id="btnGoogle" class="btn-google w-full py-3.5 rounded-full font-semibold text-[14px] flex items-center justify-center gap-3 cursor-pointer">
                    <!-- Google SVG Icon -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>

                <!-- Sign up with Apple Button -->
                <button id="btnApple" class="btn-apple w-full py-3.5 rounded-full font-semibold text-[14px] flex items-center justify-center gap-2.5 cursor-pointer">
                    <!-- Apple SVG Icon -->
                    <svg class="w-5 h-5 fill-current mb-0.5" viewBox="0 0 170 170">
                        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.02.12-9.88-1.92-14.59-6.13-3.23-2.88-7.1-7.58-11.61-14.1-6.19-8.91-11.22-18.9-15.1-29.98-3.87-11.08-5.81-21.73-5.81-31.94 0-15.01 3.82-27.42 11.45-37.25 7.63-9.83 17.38-14.86 29.26-15.09 4.35 0 9.28 1.08 14.78 3.24 5.5 2.16 9.38 3.24 11.63 3.24 2.01 0 5.92-1.08 11.73-3.24 5.81-2.16 10.42-3.24 13.84-3.24 11.21.36 20.35 4.71 27.42 13.06-10.05 6.07-15.01 14.52-14.88 25.35.13 8.37 3.31 15.56 9.54 21.57 6.23 6.01 13.79 9.35 22.68 10.02-2.12 6.27-4.75 12.52-7.89 18.75zM119.22 31.84c0-7.36 2.64-14.39 7.92-21.09 5.28-6.7 11.96-10.75 20.04-12.15.22 1.34.33 2.51.33 3.51 0 7.25-2.62 14.28-7.86 21.09-5.24 6.81-11.99 10.88-20.25 12.21-.06-.88-.18-2.07-.18-3.57z"/>
                    </svg>
                    <span>Sign up with Apple</span>
                </button>
            </div>

        </div>

        <!-- Bottom iOS Home Indicator Bar -->
        <div class="pt-2 pb-0.5 text-center flex justify-center z-20 shrink-0">
            <div class="w-32 h-1 bg-slate-900/30 rounded-full"></div>
        </div>

    </div>

    <div id="authModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-5 w-full max-w-[270px] shadow-2xl transform scale-90 transition-transform duration-200 text-center space-y-3 border border-slate-100">
            <div id="modalIcon" class="w-12 h-12 bg-slate-100 text-slate-900 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 id="modalTitle" class="text-base font-bold text-slate-900">Authenticating</h3>
            <p id="modalDesc" class="text-xs text-slate-500 leading-relaxed"></p>
            <button id="closeModalBtn" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-semibold py-2.5 text-xs rounded-xl transition cursor-pointer">
                Done
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnGoogle = document.getElementById('btnGoogle');
            const btnApple = document.getElementById('btnApple');
            const authModal = document.getElementById('authModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const closeModalBtn = document.getElementById('closeModalBtn');

            btnGoogle.addEventListener('click', () => {
                showModal(
                    'fa-brands fa-google',
                    'bg-red-50 text-red-500',
                    'Google Sign In',
                    'Connecting to your Google account...'
                );
            });

            btnApple.addEventListener('click', () => {
                showModal(
                    'fa-brands fa-apple',
                    'bg-slate-900 text-white',
                    'Apple Sign In',
                    'Authenticating with Apple ID...'
                );
            });

            function showModal(iconClass, bgClass, title, desc) {
                modalIcon.className = `w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl ${bgClass}`;
                modalIcon.innerHTML = `<i class="${iconClass}"></i>`;
                modalTitle.textContent = title;
                modalDesc.textContent = desc;

                authModal.classList.remove('opacity-0', 'pointer-events-none');
                authModal.children[0].classList.remove('scale-90');
                authModal.children[0].classList.add('scale-100');
            }

            closeModalBtn.addEventListener('click', () => {
                authModal.classList.add('opacity-0', 'pointer-events-none');
                authModal.children[0].classList.remove('scale-100');
                authModal.children[0].classList.add('scale-90');
            });
        });
    </script>
</body>
</html>
