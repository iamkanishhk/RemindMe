<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Phone Verification</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        ios: {
                            blue: '#3b82f6',
                            blueDark: '#2563eb',
                            textNavy: '#111827',
                            textSub: '#6b7280',
                            border: '#e5e7eb',
                            bgGray: '#f9fafb'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            background: #e2e8f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* iOS Primary Button styling with tactile press effect */
        .btn-ios-blue {
            background-color: #3b82f6;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .btn-ios-blue:active {
            transform: scale(0.97);
            background-color: #2563eb;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
        }

        /* Smooth Screen Slider */
        .slider-wrapper {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen-slide {
            width: 50%;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .show-screen-1 {
            transform: translateX(0%);
        }

        .show-screen-2 {
            transform: translateX(-50%);
        }

        /* OTP Code box styling */
        .otp-input {
            transition: all 0.2s ease;
        }
        .otp-input:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        /* Hide native scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-[390px] h-full max-h-[844px] bg-white rounded-[48px] shadow-2xl border-[10px] border-slate-900/10 flex flex-col justify-between overflow-hidden relative px-5 py-3 select-none">
        
        <!-- iOS Status Bar & Dynamic Island -->
        <div class="w-full flex items-center justify-between pt-1 pb-1 z-30 shrink-0 px-1">
            <span class="text-[14px] font-semibold text-slate-900 tracking-tight pl-1">9:41</span>
            
            <!-- Dynamic Island Capsule -->
            <div class="w-[96px] h-[26px] bg-black rounded-full flex items-center justify-between px-2.5">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800"></div>
            </div>

            <!-- Status Bar Icons -->
            <div class="flex items-center gap-1.5 text-slate-900 pr-1">
                <i class="fa-solid fa-signal text-[11px]"></i>
                <i class="fa-solid fa-wifi text-[11px]"></i>
                <i class="fa-solid fa-battery-full text-[13px]"></i>
            </div>
        </div>

        <div class="flex-1 overflow-hidden relative w-full">
            <div id="slider" class="slider-wrapper show-screen-1">
                
                <!-- ================= SCREEN 1: PHONE NUMBER ENTRY ================= -->
                <div class="screen-slide py-1">
                    
                    <!-- Top Navigation Bar -->
                    <div class="w-full flex items-center h-8 shrink-0">
                        <button class="w-8 h-8 rounded-full flex items-center justify-start text-slate-800 active:opacity-60 transition cursor-pointer">
                            <i class="fa-solid fa-chevron-left text-lg"></i>
                        </button>
                    </div>

                    <!-- Main Body Content -->
                    <div class="my-auto space-y-7 px-1">
                        <!-- Typography matching Image 1 -->
                        <div class="space-y-2">
                            <h1 class="text-[28px] font-bold text-[#0f172a] tracking-tight leading-tight">
                                Where should we<br>call you?
                            </h1>
                            <p class="text-[14px] text-[#64748b] font-normal leading-relaxed">
                                We'll use this number to deliver<br>your reminder calls.
                            </p>
                        </div>

                        <!-- Country Selector + Phone Input Row -->
                        <div class="flex items-center gap-3 pt-1">
                            
                            <!-- Custom Country Picker Dropdown Container -->
                            <div class="relative w-[110px] shrink-0">
                                <div class="w-full h-[52px] bg-white border border-slate-200 rounded-2xl flex items-center justify-between px-3 cursor-pointer shadow-sm">
                                    <div class="flex items-center gap-1.5">
                                        <span id="flagIcon" class="text-base">🇺🇸</span>
                                        <span id="codeText" class="text-sm font-semibold text-slate-800">+1</span>
                                    </div>
                                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                                </div>
                                <!-- Hidden Native Select for standard usability -->
                                <select id="countrySelect" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                    <option value="+1" data-flag="🇺🇸">USA (+1)</option>
                                    <option value="+1" data-flag="🇨🇦">Canada (+1)</option>
                                </select>
                            </div>

                            <!-- Phone Input Box -->
                            <div class="flex-1">
                                <input id="phoneInput" 
                                       type="tel" 
                                       placeholder="98765 43210" 
                                       value="98765 43210"
                                       maxlength="14" 
                                       class="w-full h-[52px] bg-white border border-slate-200 rounded-2xl px-4 text-[15px] font-medium text-slate-900 placeholder:text-slate-300 focus:outline-none focus:border-blue-500 shadow-sm transition">
                            </div>
                        </div>

                        <!-- Action Button -->
                        <div class="pt-1">
                            <button id="btnSendCode" 
                                    class="btn-ios-blue w-full h-[50px] rounded-2xl font-semibold text-[15px] text-white flex items-center justify-center cursor-pointer">
                                Send verification code
                            </button>
                        </div>
                    </div>

                    <!-- Bottom Standard Rates Caption & Globe Icon -->
                    <div class="pb-2 text-center space-y-6">
                        <p class="text-[12px] text-slate-400 font-normal">
                            Standard call and data rates may apply.
                        </p>
                        <div class="flex justify-center">
                            <div class="w-9 h-9 rounded-full bg-blue-50/80 text-blue-500 flex items-center justify-center text-base">
                                <i class="fa-solid fa-globe"></i>
                            </div>
                        </div>
                    </div>

                </div>


                <!-- ================= SCREEN 2: OTP VERIFICATION ================= -->
                <div class="screen-slide py-1">
                    
                    <!-- Top Navigation Bar -->
                    <div class="w-full flex items-center h-8 shrink-0">
                        <button id="btnBackToScreen1" class="w-8 h-8 rounded-full flex items-center justify-start text-slate-800 active:opacity-60 transition cursor-pointer">
                            <i class="fa-solid fa-chevron-left text-lg"></i>
                        </button>
                    </div>

                    <!-- Main OTP Body Content -->
                    <div class="my-auto space-y-7 px-1">
                        <div class="space-y-2">
                            <h1 class="text-[28px] font-bold text-[#0f172a] tracking-tight leading-tight">
                                Enter the 6-digit code<br>we sent.
                            </h1>
                            <p class="text-[14px] text-[#64748b] font-normal leading-relaxed">
                                We sent a code to <span id="displayFullPhone" class="font-bold text-slate-900">+1 98765 43210</span>
                            </p>
                        </div>

                        <!-- 6-Digit OTP Box Grid -->
                        <div id="otpGroup" class="grid grid-cols-6 gap-2 pt-1">
                            <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" class="otp-input w-full h-[54px] bg-[#f8fafc] border border-blue-200/80 rounded-2xl text-center font-bold text-lg text-slate-900">
                            <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" class="otp-input w-full h-[54px] bg-[#f8fafc] border border-blue-200/80 rounded-2xl text-center font-bold text-lg text-slate-900">
                            <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" class="otp-input w-full h-[54px] bg-[#f8fafc] border border-blue-200/80 rounded-2xl text-center font-bold text-lg text-slate-900">
                            <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" class="otp-input w-full h-[54px] bg-[#f8fafc] border border-blue-200/80 rounded-2xl text-center font-bold text-lg text-slate-900">
                            <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" class="otp-input w-full h-[54px] bg-[#f8fafc] border border-blue-200/80 rounded-2xl text-center font-bold text-lg text-slate-900">
                            <input type="text" maxlength="1" pattern="\d*" inputmode="numeric" class="otp-input w-full h-[54px] bg-[#f8fafc] border border-blue-200/80 rounded-2xl text-center font-bold text-lg text-slate-900">
                        </div>

                        <!-- Resend & Change Number Actions -->
                        <div class="text-center space-y-3 pt-1">
                            <p id="timerLabel" class="text-xs text-slate-400 font-medium">
                                Resend code (<span id="timerVal">00:45</span>)
                            </p>
                            <button id="btnResendCode" class="hidden text-xs text-blue-600 font-semibold hover:underline cursor-pointer">
                                Resend code now
                            </button>
                            <div>
                                <button id="btnChangeNumber" class="text-xs font-semibold text-blue-600 hover:text-blue-700 active:opacity-75 cursor-pointer">
                                    Change number
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Spacer -->
                    <div class="pb-2 text-center"></div>

                </div>

            </div>
        </div>

        <div class="pt-1 pb-1 text-center flex justify-center z-30 shrink-0">
            <div class="w-32 h-1 bg-slate-900/30 rounded-full"></div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('slider');
            const countrySelect = document.getElementById('countrySelect');
            const flagIcon = document.getElementById('flagIcon');
            const codeText = document.getElementById('codeText');
            const phoneInput = document.getElementById('phoneInput');
            const btnSendCode = document.getElementById('btnSendCode');
            const btnBackToScreen1 = document.getElementById('btnBackToScreen1');
            const btnChangeNumber = document.getElementById('btnChangeNumber');
            const displayFullPhone = document.getElementById('displayFullPhone');
            const timerVal = document.getElementById('timerVal');
            const timerLabel = document.getElementById('timerLabel');
            const btnResendCode = document.getElementById('btnResendCode');
            const otpInputs = document.querySelectorAll('.otp-input');

            let timerInterval = null;

            // Country Dropdown Change Listener
            countrySelect.addEventListener('change', (e) => {
                const selectedOpt = countrySelect.options[countrySelect.selectedIndex];
                const flag = selectedOpt.getAttribute('data-flag');
                flagIcon.textContent = flag;
                codeText.textContent = selectedOpt.value;
            });

            // Slide Navigation Functions
            function navigateToScreen2() {
                const rawNum = phoneInput.value.trim() || '98765 43210';
                const code = codeText.textContent || '+1';
                displayFullPhone.textContent = `${code} ${rawNum}`;

                slider.classList.remove('show-screen-1');
                slider.classList.add('show-screen-2');

                // Focus first OTP field after slide transition
                setTimeout(() => {
                    otpInputs[0].focus();
                }, 350);

                startCountdown();
            }

            function navigateToScreen1() {
                slider.classList.remove('show-screen-2');
                slider.classList.add('show-screen-1');
                clearInterval(timerInterval);
            }

            // Event Listeners
            btnSendCode.addEventListener('click', navigateToScreen2);
            btnBackToScreen1.addEventListener('click', navigateToScreen1);
            btnChangeNumber.addEventListener('click', navigateToScreen1);

            // Timer Countdown logic
            function startCountdown() {
                clearInterval(timerInterval);
                let remaining = 45;
                timerLabel.classList.remove('hidden');
                btnResendCode.classList.add('hidden');

                timerInterval = setInterval(() => {
                    remaining--;
                    const formatted = remaining < 10 ? `00:0${remaining}` : `00:${remaining}`;
                    timerVal.textContent = formatted;

                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerLabel.classList.add('hidden');
                        btnResendCode.classList.remove('hidden');
                    }
                }, 1000);
            }

            btnResendCode.addEventListener('click', () => {
                startCountdown();
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            });

            // 6-digit OTP Box Auto-advance & Backspace logic
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });

                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                    pasted.split('').forEach((char, idx) => {
                        if (otpInputs[idx]) {
                            otpInputs[idx].value = char;
                        }
                    });
                    if (otpInputs[pasted.length - 1]) {
                        otpInputs[Math.min(pasted.length, 5)].focus();
                    }
                });
            });
        });
    </script>
</body>
</html>
